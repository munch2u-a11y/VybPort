<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Join VybPort</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./register.css"></head><body><main class="auth-shell"><a class="wordmark" href="./index.html"><span class="mark">V</span>VybPort</a><section class="auth-card"><span class="eyebrow">Local prototype account</span><h1>Claim your garage.</h1><p>Your account stays in this local VybPort service. It is a real session here, not a cloud sign-up.</p><form id="registerForm"><label>Display name<input name="display_name" required minlength="2" maxlength="60" placeholder="Nemo"></label><label>Handle<input name="handle" required pattern="[a-z0-9][a-z0-9-]{2,31}" placeholder="nemo"></label><label>Password<input name="password" type="password" required minlength="8" placeholder="8+ characters"></label><label id="inviteRow" hidden>Invite code<input name="invite" autocomplete="off" placeholder="from whoever sent you the link"></label><label>Short bio <span>optional</span><textarea name="bio" maxlength="280" placeholder="What do you build?"></textarea></label><button class="button solid" type="submit">Create local account →</button><p class="form-message" id="message"></p></form><p class="auth-foot">Already registered locally? <button id="switchLogin">Log in</button></p></section></main><script src="./register.js"></script></body></html>
